apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-cicd-demo
  labels:
    app: gitlab-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitlab-cicd-demo
  template:
    metadata:
      labels:
        app: gitlab-cicd-demo
    spec:
      containers:
        - name: app
          image: cicd-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
